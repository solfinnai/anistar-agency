<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Newsreader:opsz,wght@6..72,400&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fbfbf8; color: #141414; }
  body { display: grid; grid-template-columns: 1.15fr 0.85fr; box-sizing: border-box; }
  .copy { padding: 72px 36px 72px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .wm { font-family: "Bodoni Moda", serif; font-style: italic; font-weight: 500; font-size: 42px; margin: 0; }
  h1 { font-family: "Bodoni Moda", serif; font-style: italic; font-weight: 500; font-size: 78px; line-height: 0.9; letter-spacing: 0; margin: 0; font-optical-sizing: auto; }
  .jp { font-family: "Shippori Mincho", serif; font-size: 22px; margin: 28px 0 0; }
  .mat { background: #d4d4ce; margin: 48px 48px 48px 0; position: relative; overflow: hidden; }
  .mat img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .kicker { position: absolute; left: 22px; bottom: 20px; font-family: "Shippori Mincho", serif; color: #d1006a; font-size: 22px; }
</style>
</head>
<body>
  <div class="copy">
    <p class="wm">Anistar</p>
    <div>
      <h1>Anime talent, cosplayers, and creators</h1>
      <p class="jp" lang="ja">アニメ、コスプレ、クリエイターの事務所</p>
    </div>
  </div>
  <div class="mat">
    <img src="/img/cover.jpg" alt="">
    <span class="kicker" lang="ja">表紙</span>
  </div>
</body>
</html>
